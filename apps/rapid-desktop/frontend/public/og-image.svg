<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f18;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%" fx="50%" fy="40%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glow effect -->
  <ellipse cx="600" cy="280" rx="400" ry="250" fill="url(#glowGrad)"/>
  
  <!-- RAPID title -->
  <text x="600" y="280" 
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" 
        font-size="140" 
        font-weight="400"
        letter-spacing="0.15em"
        fill="url(#textGrad)" 
        text-anchor="middle">
    RAPID<tspan fill="#818cf8">_</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="600" y="360" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        fill="#71717a" 
        text-anchor="middle">
    AI-assisted development with dev containers
  </text>
  
  <!-- A3T attribution -->
  <text x="600" y="550" 
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" 
        font-size="18" 
        fill="#52525b" 
        text-anchor="middle">
    An open source project by A3T
  </text>
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#27272a" stroke-width="1"/>
</svg>
