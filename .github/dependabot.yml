version: 2
updates:
  # npm
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - steverude
    labels:
      - dependencies
      - automation
    allow:
      - dependency-type: all

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    reviewers:
      - steverude
    labels:
      - dependencies
      - automation
      - github-actions
