name: Release

# To release:
# Option 1 (CLI): git tag v0.1.10 && git push origin v0.1.10
# Option 2 (UI): Create release in GitHub UI with a new tag
# Both methods trigger this workflow via the tag push
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Set package versions from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

          # Update root package.json
          npm pkg set version="$VERSION"

          # Update all @a3t packages
          pnpm --filter "@a3t/rapid-schema" exec npm pkg set version="$VERSION"
          pnpm --filter "@a3t/rapid-core" exec npm pkg set version="$VERSION"
          pnpm --filter "@a3t/rapid" exec npm pkg set version="$VERSION"

          # Show updated versions
          echo "Updated versions:"
          cat package.json | grep '"version"'
          cat packages/schema/package.json | grep '"version"'
          cat packages/core/package.json | grep '"version"'
          cat packages/cli/package.json | grep '"version"'

      - name: Publish @a3t/rapid-schema (with provenance)
        run: pnpm --filter @a3t/rapid-schema publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @a3t/rapid-core (with provenance)
        run: pnpm --filter @a3t/rapid-core publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @a3t/rapid (with provenance)
        run: pnpm --filter @a3t/rapid publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json
          git commit -m "chore: bump versions to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Could not push to main"

      - name: Generate release checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts

          # Create a manifest of published packages with their integrity hashes
          echo "# RAPID Release ${VERSION}" > release-artifacts/checksums.txt
          echo "# Generated at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> release-artifacts/checksums.txt
          echo "# Verify with: npm view @a3t/rapid@${VERSION} dist.integrity" >> release-artifacts/checksums.txt
          echo "" >> release-artifacts/checksums.txt

          # Get integrity hashes from npm (these are sha512)
          echo "## Package Integrity Hashes (sha512)" >> release-artifacts/checksums.txt
          for pkg in @a3t/rapid-schema @a3t/rapid-core @a3t/rapid; do
            # Wait for npm to index the package
            sleep 5
            INTEGRITY=$(npm view ${pkg}@${VERSION} dist.integrity 2>/dev/null || echo "pending")
            echo "${pkg}@${VERSION}: ${INTEGRITY}" >> release-artifacts/checksums.txt
          done

          cat release-artifacts/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/checksums.txt
          generate_release_notes: true
          body: |

            ## Installation

            ```bash
            npm install -g @a3t/rapid@${{ steps.version.outputs.version }}
            ```

            ## Security

            All packages are published with [npm provenance](https://docs.npmjs.com/generating-provenance-statements)
            using Sigstore, cryptographically linking them to this GitHub Actions workflow.

            Verify provenance: `npm audit signatures`

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=rapid-docs --branch=main
