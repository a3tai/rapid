name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Set package versions from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"

          # Update root package.json
          npm pkg set version="$VERSION"

          # Update all @a3t packages
          pnpm --filter "@a3t/rapid-schema" exec npm pkg set version="$VERSION"
          pnpm --filter "@a3t/rapid-core" exec npm pkg set version="$VERSION"
          pnpm --filter "@a3t/rapid" exec npm pkg set version="$VERSION"

          # Show updated versions
          echo "Updated versions:"
          cat package.json | grep '"version"'
          cat packages/schema/package.json | grep '"version"'
          cat packages/core/package.json | grep '"version"'
          cat packages/cli/package.json | grep '"version"'

      - name: Publish @a3t/rapid-schema
        run: pnpm --filter @a3t/rapid-schema publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @a3t/rapid-core
        run: pnpm --filter @a3t/rapid-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @a3t/rapid
        run: pnpm --filter @a3t/rapid publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Note: Version bumps are handled manually before creating the release.
      # The workflow only sets versions temporarily for npm publish with --no-git-checks.

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=rapid-docs --branch=main
